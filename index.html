<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote of the Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e12;
      --surface: #16161d;
      --accent: #d4a853;
      --accent-dim: #d4a85322;
      --text: #e8e4dc;
      --text-muted: #8a8578;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, #d4a85308 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, #d4a85305 0%, transparent 70%);
      pointer-events: none;
    }

    /* Subtle grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .container {
      max-width: 720px;
      width: 90%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Top ornament */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeDown 1s ease 0.2s forwards;
    }

    .ornament .line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .ornament .diamond {
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent);
      transform: rotate(45deg);
    }

    /* Date label */
    .date-label {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeDown 1s ease 0.4s forwards;
    }

    /* Big opening quotation mark */
    .quote-mark {
      font-family: var(--serif);
      font-size: 8rem;
      line-height: 0.6;
      color: var(--accent);
      opacity: 0.15;
      margin-bottom: -20px;
      user-select: none;
      animation: fadeIn 1.2s ease 0.5s forwards;
      opacity: 0;
    }

    /* The quote itself */
    .quote-text {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 400;
      line-height: 1.7;
      color: var(--text);
      padding: 0 20px;
      opacity: 0;
      animation: fadeUp 1.2s ease 0.7s forwards;
      transition: opacity 0.6s ease;
    }

    .quote-text em {
      color: var(--accent);
      font-style: italic;
    }

    /* Author */
    .author {
      margin-top: 36px;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeUp 1s ease 1s forwards;
      transition: opacity 0.6s ease;
    }

    .author::before {
      content: '— ';
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 48px auto 0;
      opacity: 0;
      animation: fadeIn 1s ease 1.2s forwards;
    }

    /* Refresh button */
    .refresh-btn {
      margin-top: 32px;
      background: transparent;
      border: 1px solid var(--accent-dim);
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 28px;
      cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 20px var(--accent-dim);
    }

    /* Fade classes for transitions */
    .fade-out .quote-text,
    .fade-out .author {
      opacity: 0 !important;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .quote-mark { font-size: 5rem; }
      .ornament .line { width: 36px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ornament">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>

    <div class="date-label" id="dateLabel"></div>

    <div class="quote-mark">&ldquo;</div>
    <p class="quote-text" id="quoteText"></p>
    <p class="author" id="quoteAuthor"></p>

    <div class="divider"></div>

    <button class="refresh-btn" id="refreshBtn">New Quote</button>
  </div>

  <script>
    const quotes = [
      { text: "Sometimes I looked at them and sometimes they looked at me, but rarely did we look at one another.", author: "Kesey" },
      { text: "It was suicide.  Others killed themselves with poison or a revolver.  I killed myself with minutes and hours.", author: "Barbusse" },
      { text: "Youth is the time for adventures of the body, but age for the triumphs of the mind.", author: "Smith" },
      { text: "It's not the answer that enlightens, but the question.", author: "Brilliant" },
      { text: "People will come to love their oppression, to adore the technologies that undo their capacities to think.", author: "Huxley" },
    ];

    // Pick a deterministic quote based on the day of the year
    function getDayOfYear() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function formatDate() {
      return new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    function showQuote(index) {
      const q = quotes[index % quotes.length];
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = q.author;
    }

    let currentIndex = getDayOfYear();

    // Initialize
    document.getElementById('dateLabel').textContent = formatDate();
    showQuote(currentIndex);

    // Refresh with transition
    document.getElementById('refreshBtn').addEventListener('click', () => {
      const container = document.querySelector('.container');
      container.classList.add('fade-out');

      setTimeout(() => {
        currentIndex++;
        showQuote(currentIndex);
        container.classList.remove('fade-out');
      }, 500);
    });
  </script>
</body>
</html>
