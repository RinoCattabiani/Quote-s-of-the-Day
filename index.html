<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote of the Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0a0a;
      --near-black: #111114;
      --dark: #1a1a20;
      --blue: #4dc9f6;
      --blue-bright: #6ee0ff;
      --blue-dim: #4dc9f612;
      --blue-glow: #4dc9f630;
      --white: #f5f5f7;
      --white-muted: #a0a0aa;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #4dc9f618 0%, transparent 70%);
      top: -15%; left: -10%;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #4dc9f610 0%, transparent 70%);
      bottom: -10%; right: -5%;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, #4dc9f60d 0%, transparent 70%);
      top: 40%; right: 20%;
      animation-delay: -3s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Grid lines background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(77, 201, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 201, 246, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      max-width: 760px;
      width: 90%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 56px 48px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      animation: cardIn 0.8s ease 0.2s forwards;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      padding: 1px;
      background: linear-gradient(135deg, var(--blue-glow), transparent 40%, transparent 60%, var(--blue-dim));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeDown 0.7s ease 0.5s forwards;
    }

    .badge {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--blue);
      background: var(--blue-dim);
      border: 1px solid rgba(77, 201, 246, 0.15);
      border-radius: 100px;
      padding: 8px 18px;
    }

    .date {
      font-weight: 300;
      font-size: 0.8rem;
      color: var(--white-muted);
      letter-spacing: 0.5px;
    }

    /* Quote number */
    .quote-number {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 6rem;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(77, 201, 246, 0.12);
      position: absolute;
      top: 20px;
      right: 40px;
      user-select: none;
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    /* Quote text */
    .quote-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      line-height: 1.5;
      color: var(--white);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.7s forwards;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .quote-text .highlight {
      color: var(--blue);
    }

    /* Author line */
    .author-line {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.9s forwards;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .author-dash {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--blue-bright));
      border-radius: 2px;
    }

    .author-name {
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--white-muted);
    }

    /* Bottom actions */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--glass-border);
      opacity: 0;
      animation: fadeUp 0.7s ease 1.1s forwards;
    }

    .counter {
      font-weight: 300;
      font-size: 0.78rem;
      color: var(--white-muted);
    }

    .counter span {
      color: var(--blue);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--white-muted);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.35s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--blue-dim);
      border-color: rgba(77, 201, 246, 0.25);
      color: var(--blue-bright);
      box-shadow: 0 0 24px var(--blue-dim);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), #3ab8e8);
      border: none;
      color: var(--black);
      font-weight: 600;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 24px rgba(77, 201, 246, 0.3);
      color: var(--black);
      transform: translateY(-1px);
    }

    .btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Fade transition */
    .transitioning .quote-text,
    .transitioning .author-line {
      opacity: 0 !important;
      transform: translateY(8px) !important;
    }

    /* Animations */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card { padding: 36px 28px; }
      .top-bar { flex-direction: column; gap: 12px; align-items: flex-start; }
      .bottom-bar { flex-direction: column; gap: 16px; align-items: flex-start; }
      .quote-number { font-size: 4rem; top: 12px; right: 20px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-bg"></div>

  <div class="card" id="card">
    <div class="quote-number" id="quoteNumber">01</div>

    <div class="top-bar">
      <div class="badge">Quote of the Day</div>
      <div class="date" id="dateLabel"></div>
    </div>

    <p class="quote-text" id="quoteText"></p>

    <div class="author-line">
      <span class="author-dash"></span>
      <span class="author-name" id="quoteAuthor"></span>
    </div>

    <div class="bottom-bar">
      <div class="counter"><span id="currentNum">1</span> / <span id="totalNum"></span></div>
      <div class="btn-group">
        <button class="btn" id="prevBtn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <button class="btn btn-primary" id="nextBtn">
          Next
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const quotes = [
      { text: "Sometimes I looked at them and sometimes they looked at me, but rarely did we look at one another.", author: "Kesey" },
      { text: "It was suicide.  Others killed themselves with poison or a revolver.  I killed myself with minutes and hours.", author: "Barbusse" },
      { text: "Youth is the time for adventures of the body, but age for the triumphs of the mind.", author: "Smith" },
      { text: "It's not the answer that enlightens, but the question.", author: "Brilliant" },
      { text: "People will come to love their oppression, to adore the technologies that undo their capacities to think.", author: "Huxley" },
      { text: "We mustn't forget how quickly the visions of genius become the canned goods of intellectuals.", author: "Bellow" },
      { text: "Our suffering is caused by holding on to how things might have been, should have been, could have been.", author: "Levine" },
      { text: "Middle age snuffs out more talent than even wars or sudden death.", author: "Brenan" },
      { text: "You end up as you deserve.  In old age you must put up with the face, the friends, the health, and the children you have earned.", author: "Viorst" },
      { text: "Love is every bit as violent and dangerous as murder.", author: "Hamsun" },
      { text: "They create desolation and call it peace.", author: "Tacitus" },
      { text: "But questions that don't answer themselves at the very moment of their asking are never answered.", author: "Kafka" },
      { text: "And if all that is meaningless, I want to be cured of craving for something I cannot find and of the shame of never finding it.", author: "Eliot" },
      { text: "... nobody can stand truth if it is told to him.  Truth can be tolerated only if you discover it yourself because then the pride of discovery makes the truth palatable.", author: "Perls" },
    ];

    // Deterministic daily quote based on day of year
    function getDayOfYear() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      return Math.floor((now - start) / (1000 * 60 * 60 * 24));
    }

    function formatDate() {
      return new Date().toLocaleDateString('en-US', {
        weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    let currentIndex = getDayOfYear() % quotes.length;

    function showQuote(index) {
      const q = quotes[index];
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = q.author;
      document.getElementById('quoteNumber').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('currentNum').textContent = index + 1;
    }

    function navigate(direction) {
      const card = document.getElementById('card');
      card.classList.add('transitioning');

      setTimeout(() => {
        currentIndex = (currentIndex + direction + quotes.length) % quotes.length;
        showQuote(currentIndex);
        card.classList.remove('transitioning');
      }, 400);
    }

    // Init
    document.getElementById('dateLabel').textContent = formatDate();
    document.getElementById('totalNum').textContent = quotes.length;
    showQuote(currentIndex);

    document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
    document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
    });
  </script>
</body>
</html>
